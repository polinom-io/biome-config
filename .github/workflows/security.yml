# Secrets in the full git history (gitleaks) and known vulnerabilities in the
# lockfile (OSV-Scanner). Job names `security / secrets` and
# `security / dependencies` are stable for required checks.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/security.yml@eddfd496c8521463acda9201bcfd1563c917d2b7 # v0.6.0
