name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: polinom-io/px-workflows-public/.github/workflows/ci-node.yml@eddfd496c8521463acda9201bcfd1563c917d2b7 # v0.6.0
    with:
      lint-script: check
      build-script: ""
