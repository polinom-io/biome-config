name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/ci-node.yml@b40a04acb5f2282b124f9aecbf5b596cee8cfc56 # v0.1.0
    with:
      lint-script: check
      build-script: ""
