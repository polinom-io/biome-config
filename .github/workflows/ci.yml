name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: polinom-io/px-workflows-public/.github/workflows/ci-node.yml@966ffd6eec9df7dbaefb5afe2e9f6be1656eeaf6 # v0.3.0
    with:
      lint-script: check
      build-script: ""
