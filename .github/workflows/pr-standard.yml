name: pr-standard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-standard:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/pr-standard.yml@eddfd496c8521463acda9201bcfd1563c917d2b7 # v0.6.0
